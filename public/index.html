    annuler:'← Revenir à ma commande',
    appel:'Quand vous entendez votre prénom ou votre numéro, présentez-vous au comptoir et montrez cet écran.',
    titreListe:'Votre commande',
    attente:'Envoi en cuisine…',
    ok:'✓ Reçue en cuisine',
    rate:'⚠ La cuisine n’a pas reçu le ticket. Montrez ce numéro au comptoir, on s’en occupe.',
    echec:'Commande non envoyée. Vérifiez votre connexion.',
    reessayer:'Réessayer',
    pause:'Les commandes en ligne sont suspendues. Passez au comptoir.'
  },
  en: {
    ajouter:'Add', retirer:'Remove',
    vide:'Your order is empty', article:'item', articles:'items',
    aide:'Add some dishes', pret:'Ready to send',
    envoyer:'Send my order', envoi:'Sending…',
    quoi:'Order', recu:'Your order',
    note:'Payment at the counter.',
    rentrer:'← Back to the menu',
    revueTitre:'Check your order',
    revueQuoi:'Once sent, it goes straight to the kitchen.',
    revueTotal:'Total', revueConfirmer:'Confirm',
    revueModifier:'← Change my order',
    chargeTexte:'Sending to the kitchen',
    nomTitre:'What name?', nomChamp:'Your first name',
    nomQuoi:'The counter will call your first name or your number when it’s ready.',
    nomVide:'Enter your first name to continue.',
    annuler:'← Back to my order',
    appel:'When you hear your name or your number, come to the counter and show this screen.',
    titreListe:'Your order',
    attente:'Sending to the kitchen…',
    ok:'✓ Received by the kitchen',
    rate:'⚠ The kitchen did not receive the ticket. Show this number at the counter and staff will take it from there.',
    echec:'Order not sent. Check your connection.',
    reessayer:'Try again',
    pause:'Online ordering is paused. Please order at the counter.'
  }
};
const T = cle => TXT[LANGUE][cle];

/**
 * L'adresse du serveur de commandes.
 *
 * Vide quand la page est servie par le serveur lui-meme, ce qui est le cas
 * normal. Elle est renseignee par `npm run build:static`, qui produit une
 * page a deposer sur un hebergeur statique — Netlify, par exemple — pendant
 * que l'API tourne ailleurs.
 */
const API = window.COMPTOIR_API ?? '';

/** id -> quantite. Les plats absents valent zero. */
const panier = new Map();

/** Echappement HTML : les noms vont dans du innerHTML. */
function ech(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/**
 * Cle d'idempotence de l'envoi en cours.
 *
 * Elle permet au serveur de reconnaitre deux envois du MEME panier et de
 * n'en garder qu'une commande. On la remet a zero des que le panier change :
 * un panier modifie est une autre commande, et doit obtenir son propre
 * numero.
 */
let cleEnvoi = null;

/* `crypto.randomUUID` n'existe pas hors contexte securise — donc pas sur
   un http://192.168.x.x en test sur le reseau du commerce. */
function cleAleatoire(){
  const octets = new Uint8Array(16);
  if (self.crypto && crypto.getRandomValues) crypto.getRandomValues(octets);
  else for (let i=0;i<16;i++) octets[i] = Math.floor(Math.random()*256);
  return [...octets].map(o => o.toString(16).padStart(2,'0')).join('');
}

function totalArticles(){
  let n = 0;
  for (const q of panier.values()) n += q;
  return n;
}

/** Reporte le panier sur les compteurs affiches. */
function refletPanier(){
  corps.querySelectorAll('.qte').forEach(boite => {
    const q = panier.get(boite.dataset.id) ?? 0;
    boite.querySelector('.v').textContent = q;
    boite.dataset.zero = q === 0 ? '1' : '0';
  });
  majBarre();
}

function majBarre(){
  const n = totalArticles();
  $('cCompte').textContent = n === 0
    ? T('vide')
    : n + ' ' + (n > 1 ? T('articles') : T('article'));
  $('cAide').textContent = n === 0 ? T('aide') : T('pret');
  $('cEnvoyer').textContent = T('envoyer');
  $('cEnvoyer').disabled = n === 0;
  $('rRentrer').textContent = T('rentrer');
}

/* Un seul ecouteur pour toute la carte : les compteurs sont recrees a chaque
   bascule de langue, et rebrancher un ecouteur par plat les perdrait. */
corps.addEventListener('click', e => {
  const bouton = e.target.closest('.qte button');
  if (!bouton) return;

  const boite = bouton.closest('.qte');
  const id = boite.dataset.id;
  const pas = bouton.classList.contains('plus') ? 1 : -1;

  /* 20 par plat : au-dela c'est une commande de groupe, qui se discute au
     comptoir. Le serveur applique la meme borne, lui pour de vrai. */
  const q = Math.max(0, Math.min(20, (panier.get(id) ?? 0) + pas));
  if (q === 0) panier.delete(id); else panier.set(id, q);

  boite.querySelector('.v').textContent = q;
  boite.dataset.zero = q === 0 ? '1' : '0';

  cleEnvoi = null;          /* panier modifie : nouvelle commande */
  $('cAvis').textContent = '';
  majBarre();
  if (navigator.vibrate) navigator.vibrate(8);
});

/* ---------- 1. la relecture ----------
   Une commande envoyee est imprimee en cuisine dans la seconde : il n'y a
   pas d'annulation possible ensuite. Ce coup d'oeil est le dernier moment
   ou corriger une erreur ne coute rien. */

/** Le panier, en lignes lisibles, dans la langue du client. */
function lignesDuPanier(){
  const parId = new Map();
  for (const sec of CARTE) for (const pl of sec.plats) parId.set(pl.id, { pl, sec });

  return [...panier].map(([id, quantite]) => {
    const e = parId.get(id);
    return {
      quantite,
      nom: LANGUE === 'fr' ? e.pl.fr : e.pl.en,
      section: LANGUE === 'fr' ? e.sec.fr : e.sec.en
    };
  });
}

function demanderRevue(){
  if (totalArticles() === 0) return;

  $('revueTitre').textContent = T('revueTitre');
  $('revueQuoi').textContent = T('revueQuoi');
  $('revueTotalLib').textContent = T('revueTotal');
  $('revueConfirmer').textContent = T('revueConfirmer');
  $('revueModifier').textContent = T('revueModifier');

  const n = totalArticles();
  $('revueTotal').textContent = n + ' ' + (n > 1 ? T('articles') : T('article'));

  $('revueListe').innerHTML = lignesDuPanier().map(l =>
    '<div class="revue-ligne"><b>' + l.quantite + '&times;</b>'
    + '<span>' + ech(l.nom) + '<small>' + ech(l.section) + '</small></span></div>'
  ).join('');

  $('revue').classList.add('ouvert');
  $('revue').querySelector('.panneau').scrollTop = 0;
}

function fermerRevue(){ $('revue').classList.remove('ouvert'); }

$('cEnvoyer').addEventListener('click', demanderRevue);
$('revueModifier').addEventListener('click', fermerRevue);
$('revueConfirmer').addEventListener('click', () => { fermerRevue(); demanderNom(); });

/* ---------- 2. l'etape du prenom ----------
   Demandee au dernier moment, pas a l'ouverture : personne ne donne son
   prenom pour regarder un menu, tout le monde l'accepte une fois la
   commande prete a partir. */

function demanderNom(){
  if (totalArticles() === 0) return;

  $('nomTitre').textContent = T('nomTitre');
  $('nomQuoi').textContent = T('nomQuoi');
  $('nomChamp').placeholder = T('nomChamp');
  $('nomValider').textContent = T('envoyer');
  $('nomAnnuler').textContent = T('annuler');
  $('nomErreur').textContent = '';

  $('nomEtape').classList.add('ouvert');
  /* Le focus doit attendre la fin de l'animation, sinon iOS ouvre le
     clavier sur un panneau encore en train d'entrer et le fait sauter. */
  setTimeout(() => $('nomChamp').focus(), 340);
}

function fermerNom(){
  $('nomEtape').classList.remove('ouvert');
  $('nomChamp').blur();
}

/* Reculer d'un cran ramene a la relecture, pas au menu : on defait une
   etape a la fois, comme on l'attend d'un « retour ». */
$('nomAnnuler').addEventListener('click', () => { fermerNom(); demanderRevue(); });
$('nomValider').addEventListener('click', () => envoyer());

/* Entree vaut validation : c'est ce que fait la touche « OK » du clavier. */
$('nomChamp').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); envoyer(); }
});
$('nomChamp').addEventListener('input', () => { $('nomErreur').textContent = ''; });

addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('nomEtape').classList.contains('ouvert')){ fermerNom(); demanderRevue(); }
  else if ($('revue').classList.contains('ouvert')) fermerRevue();
});

/* ---------- 3. la transition ----------
   L'envoi dure parfois 200 ms. Un recu qui surgirait d'un coup aurait
   l'air d'etre apparu sans rien faire ; on laisse a l'animation le temps
   d'etre lue, et le client voit ce qui se passe vraiment en cuisine. */

const DUREE_MINIMALE = 1400;

function montrerChargement(){
  $('chargeTexte').textContent = T('chargeTexte');
  $('chargement').classList.add('ouvert');
}

function cacherChargement(){ $('chargement').classList.remove('ouvert'); }

/** Attend que `depuis` ait au moins `DUREE_MINIMALE` millisecondes. */
function laisserLeTemps(depuis){
  const reste = DUREE_MINIMALE - (Date.now() - depuis);
  return reste > 0 ? new Promise(r => setTimeout(r, reste)) : Promise.resolve();
}

/* ---------- l'envoi ---------- */

let envoiEnCours = false;

async function envoyer(){
  /* Deux protections contre le double envoi : ce drapeau, immediat, et la
     cle d'idempotence cote serveur, qui rattrape tout le reste — reessai
     apres coupure, rechargement de la page, deux onglets. */
  if (envoiEnCours || totalArticles() === 0) return;

  const nom = $('nomChamp').value.trim();
  if (nom === ''){
    $('nomErreur').textContent = T('nomVide');
    $('nomChamp').focus();
    return;
  }

  envoiEnCours = true;

  const bouton = $('nomValider');
  bouton.disabled = true;
  bouton.textContent = T('envoi');
  $('cAvis').textContent = '';
  $('nomErreur').textContent = '';

  const debut = Date.now();
  montrerChargement();

  cleEnvoi = cleEnvoi ?? cleAleatoire();

  try {
    const reponse = await fetch(API + '/api/commandes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clientOrderId: cleEnvoi,
        lang: LANGUE,
        nom,
        items: [...panier].map(([id, qty]) => ({ id, qty }))
      })
    });

    const donnees = await reponse.json().catch(() => ({}));

    if (!reponse.ok) {
      /* Le serveur a refuse pour une raison qu'il sait expliquer : on la
         montre telle quelle plutot qu'un message passe-partout. */
      throw new Error(donnees.erreur || T('echec'));
    }

    await laisserLeTemps(debut);
    cacherChargement();
    fermerNom();
    montrerRecu(donnees);
    suivre(donnees.id);
  } catch (erreur) {
    /* Aucun numero n'est invente ici. Si le serveur n'a pas confirme, le
       client n'a pas de commande, et le lui laisser croire serait pire que
       de le dire. Le panier et le prenom restent intacts pour reessayer.

       En cas d'echec on NE laisse PAS courir l'animation : la mauvaise
       nouvelle doit arriver tout de suite, pas apres une seconde et demie
       de faux suspense. */
    cacherChargement();
    $('nomErreur').textContent = erreur.message || T('echec');
    bouton.textContent = T('reessayer');
  } finally {
    envoiEnCours = false;
    bouton.disabled = false;
    if (!$('nomErreur').textContent) bouton.textContent = T('envoyer');
  }
}

/* ---------- le recu ---------- */

function montrerRecu(commande){
  poserLogoRecu();

  $('rQuoi').textContent = T('quoi');
  $('rNo').textContent = '#' + commande.numero;
  $('rNom').textContent = commande.nom;

  $('rQuand').textContent = horodatage(new Date());

  $('rAppel').innerHTML = T('appel');

  $('rTitreListe').textContent = T('titreListe');
  $('rCompte').textContent = commande.total + ' '
    + (commande.total > 1 ? T('articles') : T('article'));

  $('rTable').innerHTML = commande.articles.map(a =>
    '<tr><td class="q">' + a.quantite + '&times;</td>'
    + '<td class="n">' + ech(a.nom) + '<small>' + ech(a.section) + '</small></td></tr>'
  ).join('');

  $('rNote').innerHTML = T('note');
  $('rAdresse').textContent = CONFIG.adresse;
  peindreEtat(commande.etatImpression);

  $('recu').classList.add('ouvert');
  $('recu').scrollTop = 0;
  if (navigator.vibrate) navigator.vibrate([10, 40, 10]);
}

/**
 * « mardi 22 septembre · 01h21 ».
 *
 * L'heure est assemblee a la main plutot que par toLocaleTimeString : en
 * fr-CA celui-ci rend « 01 h 21 », avec des espaces, qui ne ressemble ni au
 * ticket de cuisine ni a ce qu'on lit sur une facture.
 */
function horodatage(instant){
  const locale = LANGUE === 'fr' ? 'fr-CA' : 'en-CA';
  const jour = instant.toLocaleDateString(locale, { weekday:'long', day:'numeric', month:'long' });
  const hh = String(instant.getHours()).padStart(2, '0');
  const mm = String(instant.getMinutes()).padStart(2, '0');

  return jour + ' · ' + (LANGUE === 'fr' ? `${hh}h${mm}` : `${hh}:${mm}`);
}

/* Le logo de la page, repris sur le recu. Comme pour la carte, on clone le
   SVG deja present plutot que d'en charger un second. */
function poserLogoRecu(){
  const cible = $('rLogo');
  if (cible.childElementCount) return;
  const source = document.querySelector('#marque svg');
  if (source) cible.appendChild(source.cloneNode(true));
}

/**
 * L'etat d'impression, dit honnetement.
 *
 * Le numero reste affiche dans TOUS les cas : la commande existe sur le
 * serveur meme si le papier n'est pas sorti, et le comptoir peut la servir
 * depuis son ecran. Ce que la page ne fait jamais, c'est annoncer un ticket
 * imprime que l'imprimante n'a pas confirme.
 */
function peindreEtat(etat){
  const boite = $('rEtat');
  if (etat === 'imprimee')      { boite.dataset.etat = 'ok';      boite.textContent = T('ok'); }
  else if (etat === 'echec')    { boite.dataset.etat = 'rate';    boite.textContent = T('rate'); }
  else                          { boite.dataset.etat = 'attente'; boite.textContent = T('attente'); }
}

/**
 * Suit l'etat du ticket jusqu'a ce qu'il soit tranche.
 *
 * On s'arrete au bout d'une minute : passe ce delai le serveur a de toute
 * facon declare le ticket echoue, et un telephone qui interroge sans fin
 * dans une poche vide la batterie pour rien.
 */
function suivre(id){
  const fin = Date.now() + 60000;

  const tic = setInterval(async () => {
    try {
      const r = await fetch(API + '/api/commandes/' + encodeURIComponent(id));
      if (!r.ok) return;
      const c = await r.json();
      peindreEtat(c.etatImpression);
      if (c.etatImpression === 'imprimee' || c.etatImpression === 'echec') clearInterval(tic);
    } catch { /* hors ligne : on retentera au prochain tour */ }

    if (Date.now() > fin) clearInterval(tic);
  }, 2500);
}

/* Revenir au menu garde le panier : on peut vouloir ajouter un plat oublie.
   Le renvoyer creera une nouvelle commande, avec son propre numero. */
$('rRentrer').addEventListener('click', () => {
  $('recu').classList.remove('ouvert');
  $('cEnvoyer').textContent = T('envoyer');
  $('cAvis').textContent = '';
});

/* Si le commerce a suspendu les commandes, on le dit avant que le client
   compose tout un panier pour rien. */
fetch(API + '/api/etat')
  .then(r => r.json())
  .then(etat => {
    if (etat.ouvert) return;
    $('cEnvoyer').disabled = true;
    $('cAvis').textContent = T('pause');
  })
  .catch(() => { /* page ouverte sans serveur : la carte reste consultable */ });

function rendreCarte(){
  corps.replaceChildren();

  CARTE.forEach((sec, i) => {
    const d = document.createElement('div');
    d.className = 'sect';
    d.style.setProperty('--k', i);
    if (sec.teinte) d.style.setProperty('--pastille', sec.teinte);

    const titre = LANGUE === 'fr' ? sec.fr : sec.en;
    const note  = texte(sec, 'note');

    /* LE BANDEAU DE BAMBOU, avec l'assiette posee AU BOUT : exactement
       la disposition des feuilles imprimees du client. Une seule image
       par section, jamais sous les noms de plats. */
    let h = '<div class="plank">'
          + '<h3>' + titre
          + (note ? '<i class="sec-note">(' + note + ')</i>' : '')
          + '</h3>'
          + (sec.img && PLATS_IMG[sec.img]
              ? '<img src="' + PLATS_IMG[sec.img] + '" alt="" '
                + 'width="240" height="240" loading="lazy" decoding="async">'
              : '')
          + '</div>';

    /* Les phrases d'explication de categorie (quoiFr/quoiEn) restent dans
       les donnees mais ne sont plus affichees : retrait demande. */

    /* Chaque plat porte son compteur. La quantite n'est PAS relue du DOM :
       elle vit dans `panier`, et le DOM ne fait que l'afficher. Basculer
       FR/EN reconstruit toute la carte, et un panier lu depuis le DOM
       serait perdu a chaque bascule. */
    (sec.plats || []).forEach(pl => {
      const nom = LANGUE === 'fr' ? pl.fr : pl.en;
      const ing = texte(pl, 'd');

      h += '<div class="plat-ligne">'
         +   '<div class="plat-txt">'
         +     '<div class="plat"><span class="n">' + ech(nom) + '</span></div>'
         +     (ing ? '<div class="plat-d">' + ech(ing) + '</div>' : '')
         +   '</div>'
         +   '<div class="qte" data-id="' + ech(pl.id) + '" data-zero="1">'
         +     '<button class="moins" type="button" aria-label="' + ech(T('retirer') + ' ' + nom) + '">&#8722;</button>'
         +     '<span class="v" aria-live="polite">0</span>'
         +     '<button class="plus" type="button" aria-label="' + ech(T('ajouter') + ' ' + nom) + '">+</button>'
         +   '</div>'
         + '</div>';
    });

    d.innerHTML = h;
    corps.appendChild(d);
  });

  /* La carte vient d'etre reconstruite : les compteurs repartent a zero
     dans le DOM. On y reporte le panier, qui lui n'a pas bouge. */
  refletPanier();
}

function basculer(l){
  LANGUE = l;
  majGalerie();          /* la vitrine parle la meme langue que la carte */
  $('langFr').setAttribute('aria-pressed', String(l === 'fr'));
  $('langEn').setAttribute('aria-pressed', String(l === 'en'));
  $('papier').setAttribute('lang', l === 'fr' ? 'fr-CA' : 'en-CA');
  rendreCarte();
  ajusterDeco();          /* la longueur change avec la langue */
}
/* des qu'on navigue au clavier, on rend l'anneau de focus visible */
addEventListener('keydown', e => { if (e.key === 'Tab') delete papier.dataset.tap; });
$('langFr').addEventListener('click', () => basculer('fr'));
$('langEn').addEventListener('click', () => basculer('en'));
rendreCarte();

const feuille=$('feuille'), papier=$('papier');
function ouvrir(){
  poserLogo();
  feuille.classList.add('ouvert');
  papier.scrollTop=0;
  papier.dataset.tap = '1';
  ajusterDeco();
  $('fermer').focus({preventScroll:true});
  if (navigator.vibrate) navigator.vibrate(11);
}
function fermer(){ feuille.classList.remove('ouvert'); }
$('btnMenu').addEventListener('click', e => { e.preventDefault(); ouvrir(); });
$('fermer').addEventListener('click', fermer);
feuille.addEventListener('click', e => { if (e.target === feuille) fermer(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && feuille.classList.contains('ouvert')) fermer(); });

/* ---------- LE TAPIS : les plats defilent en continu ----------
   Un tapis de sushi : les plats passent devant vous sans fin. On duplique
   la liste pour que la boucle soit invisible, et on met en pause au toucher. */
const voie = $('voie');
const plats = CONFIG.defile;
function bande(){
  return plats.map(p => '<span class="plat-d1">' + p + '</span>').join('<i class="pt"></i>');
}
voie.innerHTML = bande() + '<i class="pt"></i>' + bande() + '<i class="pt"></i>';
if (REDUIT) voie.style.animation = 'none';

/* toucher le logo : le koi du « 6 » fretille */
$('marque').addEventListener('pointerdown', () => {
  if (REDUIT) return;
  $('marque').querySelector('svg').animate(
    [{transform:'scale(1)'},{transform:'scale(.985)'},{transform:'scale(1)'}],
    {duration:460, easing:'cubic-bezier(.33,.90,.35,1)'});
  if (navigator.vibrate) navigator.vibrate(9);
});
</script>
