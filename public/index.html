    radial-gradient(58% 40% at 20% 8%, rgba(237,31,39,.16), transparent 60%),
    radial-gradient(52% 36% at 86% 22%, rgba(124,143,107,.16), transparent 62%),
    radial-gradient(70% 44% at 50% 106%, rgba(237,31,39,.13), transparent 64%),
    linear-gradient(172deg,#221E1F 0%,var(--encre) 46%,#100E0E 100%);
  animation:respire 16s ease-in-out infinite alternate;
}
@keyframes respire{to{opacity:.92}}
.grain{
  position:absolute;inset:0;opacity:.4;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.38'/></svg>");
}
/* les feuilles de bambou : la nature demandee, tirees de la culture japonaise.
   Chaque feuille pivote depuis sa BASE, jamais son centre : une feuille
   bouge depuis sa tige. Trois plans de profondeur a des vitesses
   differentes donnent une vraie parallaxe plutot qu'un bloc qui glisse. */
.bambou{position:absolute;inset:0;width:100%;height:100%}
.feuille{animation:derive 19s ease-in-out infinite alternate;will-change:transform}
.plan-loin   .feuille{animation-duration:31s}
.plan-median .feuille{animation-duration:24s}
.plan-proche .feuille{animation-duration:17s}
.f1{transform-origin:118px  -8px;animation-delay:-2s}
.f2{transform-origin:270px 774px;animation-delay:-11s}
.f3{transform-origin:372px 356px;animation-delay:-19s}
.f4{transform-origin:416px 138px;animation-delay:-6s}
.f5{transform-origin:-16px 632px;animation-delay:-14s}
.f6{transform-origin:46px  782px;animation-delay:-23s}
.f7{transform-origin:-14px  36px;animation-delay:-4s}
.f8{transform-origin:414px 604px;animation-delay:-9s}
.f9{transform-origin:-24px 306px;animation-delay:-16s}
@keyframes derive{
  0%  {transform:rotate(-2.6deg) translate(0,0)}
  50% {transform:rotate(1.1deg)  translate(4px,-7px)}
  100%{transform:rotate(3.4deg)  translate(-3px,5px)}
}
/* ---- les croquis a la craie : le decor du tableau noir ----
   Ils se dessinent apres l'ouverture du noren, l'un apres l'autre,
   puis respirent tres lentement. Ils restent derriere la carte et
   ne captent jamais le regard avant le bouton. */
.croquis{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.croq{opacity:0;animation:croqIn 1.05s ease-out forwards, croqVit 15s ease-in-out infinite alternate}
.c1{animation-delay:1.45s, 3.0s}
.c2{animation-delay:1.60s, 3.9s}
.c3{animation-delay:1.75s, 4.6s}
.c4{animation-delay:1.90s, 5.3s}
.c5{animation-delay:2.05s, 6.1s}
.c6{animation-delay:2.20s, 6.8s}
.c7{animation-delay:2.35s, 7.4s}
@keyframes croqIn{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes croqVit{0%{opacity:1}100%{opacity:.62}}

/* la lanterne : une lueur chaude qui balaie lentement */
.lanterne{
  position:absolute;left:-40%;top:-12%;width:58%;height:132%;
  background:linear-gradient(100deg,transparent,rgba(255,214,190,.16) 44%,rgba(237,31,39,.08) 56%,transparent);
  filter:blur(36px);transform:rotate(5deg);
  animation:balaye 26s ease-in-out infinite alternate;
}
@keyframes balaye{to{transform:translateX(150%) rotate(5deg)}}

/* ====== ARRIVEE : le noren s'ecarte ======
   Le rideau de tissu a l'entree d'un restaurant japonais : deux pans
   fendus se retirent et la salle apparait. */
#noren{position:fixed;top:-8vh;bottom:-8vh;left:0;width:100%;height:auto;z-index:70;pointer-events:none}
#noren i{
  position:absolute;top:0;height:100%;width:50.6%;
  background:linear-gradient(178deg,#2B2627,#1A1718);
  box-shadow:0 0 44px rgba(0,0,0,.7);
}
#noren .g{left:0;transform-origin:0% 50%;animation:norenG .84s cubic-bezier(.62,0,.20,1) .42s forwards}
#noren .d{right:0;transform-origin:100% 50%;animation:norenD .84s cubic-bezier(.62,0,.20,1) .42s forwards}
@keyframes norenG{to{transform:translateX(-101%)}}
@keyframes norenD{to{transform:translateX(101%)}}
/* la fente rouge du noren, qui s'ouvre en premier */
#noren .fente{
  position:absolute;left:50%;top:0;width:2px;height:100%;margin-left:-1px;
  background:linear-gradient(180deg,transparent,var(--rouge) 24%,#FFF 50%,var(--rouge) 76%,transparent);
  transform:scaleY(0);transform-origin:50% 50%;
  animation:fenteUp .42s var(--doux) forwards, fenteOut .3s ease-out .5s forwards;
}
@keyframes fenteUp{to{transform:scaleY(1)}}
@keyframes fenteOut{to{opacity:0}}
#noren.parti{display:none}

/* ====== LA CARTE ====== */
.carte{
  position:relative;z-index:2;width:100%;max-width:398px;
  max-height:100%;overflow-y:auto;
  background:linear-gradient(172deg,rgba(43,38,39,.94),rgba(20,18,18,.96));
  border:1px solid var(--ligne);
  border-radius:clamp(14px,4vw,20px);
  padding:clamp(24px,6.4vw,36px) clamp(20px,5.6vw,30px) clamp(17px,4.4vw,23px);
  box-shadow:0 28px 64px -26px rgba(0,0,0,.9), 0 0 0 1px rgba(250,250,250,.03) inset;
  text-align:center;
  opacity:0;transform:translateY(10px) scale(.992);
  animation:carteIn .56s var(--doux) 1.22s forwards;
}
@keyframes carteIn{to{opacity:1;transform:none}}
.carte::before{
  content:"";position:absolute;inset:7px;border-radius:inherit;pointer-events:none;
  border:1px solid rgba(237,31,39,.24);
}
.monte{opacity:0;animation:monte .5s var(--doux) forwards;
  animation-delay:calc(1.36s + var(--i,0)*62ms)}
@keyframes monte{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- le logo : sur son champ noir, comme il a ete concu ---- */
.marque{display:block;width:100%;min-height:44px;border:0;background:none;padding:0;cursor:pointer;position:relative}
.marque svg{width:min(232px,78%);height:auto;display:block;margin:0 auto;
  transition:transform .3s var(--doux)}
.marque:active svg{transform:scale(.986)}

.lieu{
  margin-top:clamp(13px,3.6vw,18px);
  font-size:clamp(8.6px,2.3vw,9.6px);font-weight:400;letter-spacing:.28em;
  text-transform:uppercase;color:var(--bambou-clair);
}
.filet{width:38px;height:1px;margin:clamp(13px,3.4vw,17px) auto 0;
  background:linear-gradient(90deg,transparent,var(--rouge),transparent)}

/* le h1 existe pour les lecteurs d'ecran et le referencement, mais ne
   s'affiche pas : le logo porte deja le nom, en plus grand. */
.hors-ecran{
  position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;
}
.sous{margin-top:5px;font-size:clamp(10.5px,2.9vw,12px);color:var(--creme-dim);font-weight:300}

/* ====== LE TAPIS : les plats defilent ======
   Un ruban continu, comme le tapis d'un comptoir a sushi. */
.tapis{
  width:100%;margin-top:clamp(16px,4.4vw,22px);
  padding:clamp(11px,3vw,15px) 0;
  /* pas de bordure haute : le filet rouge au-dessus fait deja la separation */
  border-bottom:1px solid var(--ligne);
  overflow:hidden;position:relative;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%,#000 78%,transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 22%,#000 78%,transparent 100%);
}
.voie{
  display:flex;align-items:center;gap:0;width:max-content;
  animation:defile 26s linear infinite;
}
@keyframes defile{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.plat-d1{
  font-family:Oswald,"Arial Narrow",sans-serif;font-weight:400;
  font-size:clamp(14px,3.9vw,17px);letter-spacing:.05em;text-transform:uppercase;
  color:var(--creme);white-space:nowrap;
}
.pt{
  display:inline-block;width:5px;height:5px;margin:0 clamp(13px,3.6vw,19px);
  background:var(--rouge);transform:rotate(45deg);flex:none;
}

/* ====== LE MENU : l'option principale ====== */
.menu{
  position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;min-height:clamp(66px,17vw,78px);margin-top:clamp(16px,4.4vw,22px);
  padding:14px 18px;border-radius:14px;overflow:hidden;text-decoration:none;
  background:linear-gradient(168deg,var(--rouge-doux) 0%,var(--rouge) 50%,var(--rouge-fonce) 100%);
  color:#FFF;font-family:Oswald,sans-serif;font-weight:500;
  font-size:clamp(19px,5.4vw,24px);letter-spacing:.14em;text-transform:uppercase;line-height:1.1;
  box-shadow:0 14px 30px -12px rgba(237,31,39,.66), 0 1px 0 rgba(255,255,255,.22) inset;
  transition:transform .2s var(--doux),box-shadow .22s ease;
}
.menu::after{
  content:"";position:absolute;top:0;left:-62%;width:44%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.34),transparent);
  transform:skewX(-17deg);animation:reflet 6.8s ease-in-out 2.6s infinite;
}
@keyframes reflet{0%{left:-62%}17%{left:130%}100%{left:130%}}
.menu:active{transform:scale(.976)}
.menu svg{width:19px;height:19px;flex:none;fill:currentColor}
.menu .ligne{display:flex;align-items:center;gap:10px}

/* ====== LIENS ====== */
/* Une seule colonne : le lien social prend toute la largeur, comme le
   bouton du menu, et reste donc centre sous lui. La grille en deux
   colonnes datait de l'epoque ou il y avait Instagram ET Facebook. */
/* Deux colonnes quand il y a la galerie ET Facebook, une seule sinon.
   `auto-fit` s'en charge tout seul : si la galerie est vide, son bouton
   n'est pas rendu et Facebook reprend toute la largeur. */
.liens{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:9px;margin-top:clamp(10px,2.8vw,13px)}
.lien{
  width:100%;min-height:clamp(48px,12.5vw,56px);border-radius:12px;
  border:1px solid var(--ligne);background:rgba(250,250,250,.05);
  color:var(--creme);text-decoration:none;
  /* icone et texte sur UNE ligne, centres : meme geometrie que .menu,
     mais volontairement discret -- c'est le menu qui doit attirer. */
  display:flex;flex-direction:row;align-items:center;justify-content:center;gap:9px;
  font-family:Oswald,sans-serif;
  font-size:clamp(11px,3vw,12.5px);font-weight:400;letter-spacing:.17em;text-transform:uppercase;
  transition:transform .2s var(--doux),background .24s ease,border-color .24s ease;
}
.lien svg{width:16px;height:16px;flex:none;fill:var(--bambou-clair)}
/* La galerie est un <button>, pas un <a> : il faut lui retirer ce que le
   navigateur impose aux boutons et qu'il n'herite pas. */
button.lien{cursor:pointer;font-family:Oswald,sans-serif;padding:0;appearance:none}
.lien:active{transform:scale(.968);background:rgba(237,31,39,.12);border-color:rgba(237,31,39,.45)}

footer{
  margin-top:clamp(14px,3.8vw,18px);padding-top:clamp(11px,3vw,14px);
  border-top:1px solid var(--ligne);
  font-size:clamp(8.4px,2.25vw,9.4px);line-height:1.6;color:var(--creme-faint);letter-spacing:.02em;
}
footer b{display:block;color:var(--creme-dim);font-weight:400;letter-spacing:.18em;
  text-transform:uppercase;margin-bottom:3px}
footer a{color:var(--creme-faint);text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;
  min-height:44px;padding:0 9px;border-bottom:1px solid rgba(237,31,39,.36)}
.brouillon{
  margin-top:7px;font-size:8px;letter-spacing:.06em;color:rgba(250,250,250,.26);
  font-style:italic;line-height:1.4;
}

/* ====== LA FEUILLE DE MENU ====== */
/* ======================================================================
   LA CARTE — bandeaux de bambou, comme les feuilles imprimees du client.
   Le bambou, l'ardoise et les assiettes sont DECOUPES dans leurs propres
   feuilles : rien n'est imite. Le rouge, l'encre et les polices viennent
   du :root de la page d'accueil.
   ====================================================================== */
#feuille{
  position:fixed;inset:0;z-index:90;display:none;
  background:rgba(10,9,9,.74);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:clamp(8px,2.6vw,16px);
  padding-bottom:calc(clamp(8px,2.6vw,16px) + env(safe-area-inset-bottom,0px));
}
#feuille.ouvert{display:flex;align-items:center;justify-content:center}

.papier{
  position:relative;width:100%;max-width:414px;max-height:100%;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  border-radius:clamp(18px,5vw,26px);
  border:1px solid rgba(239,206,148,.20);
  color:var(--creme);
  box-shadow:0 34px 80px -28px rgba(0,0,0,.92);
  animation:feuilleIn .46s var(--doux);
  background:
    radial-gradient(58% 26% at 18% 3%,  rgba(237,31,39,.13), transparent 62%),
    radial-gradient(52% 24% at 86% 12%, rgba(124,143,107,.12), transparent 64%),
    linear-gradient(172deg,#201C1D 0%,#171415 46%,#0E0C0C 100%);
  background-attachment:local,local,local;
}

/* ====== LE DECOR DU FOND DE CARTE ======
   Meme vocabulaire que la page d'accueil : le feuillage de bambou sur
   trois plans, les croquis a la craie du comptoir, et la lumiere chaude
   de la lanterne. Tout vit SOUS le contenu et reste tres en-dessous des
   assiettes en poids visuel : c'est la nourriture qui doit vendre. */
.deco{
  /* Dans un conteneur qui defile, inset:0 ne couvre que la FENETRE
     visible. On fixe donc une hauteur qui suit tout le defilement,
     sinon le decor s'arrete au premier ecran. */
  position:absolute;top:0;left:0;right:0;height:100%;
  z-index:0;pointer-events:none;overflow:hidden;border-radius:inherit;
}
.papier>*:not(.deco){position:relative;z-index:1}
.deco svg{position:absolute;left:0;width:100%;display:block}

/* --- la lumiere : rouge du logo en haut, vert bambou plus bas --- */
.d-lueur{
  position:absolute;inset:0;
  /* UNE nappe d'orbes, sans repetition : chacune est posee a une position
     absolue en pixels et s'eteint sur une couleur en alpha 0 (jamais sur
     `transparent`, qui est du NOIR transparent et salit le halo). Aucune
     jonction de tuile ne peut donc couper une orbe. */
  background:
    radial-gradient(195px 124px at 9% 140px,rgba(237,31,39,0.22) 0%,rgba(237,31,39,0.136) 34%,rgba(237,31,39,0.057) 60%,rgba(237,31,39,0.018) 80%,rgba(237,31,39,0) 100%),
    radial-gradient(202px 131px at 80% 502px,rgba(157,176,137,0.2) 0%,rgba(157,176,137,0.124) 34%,rgba(157,176,137,0.052) 60%,rgba(157,176,137,0.016) 80%,rgba(157,176,137,0) 100%),
    radial-gradient(165px 95px at 46% 869px,rgba(239,206,148,0.13) 0%,rgba(239,206,148,0.081) 34%,rgba(239,206,148,0.034) 60%,rgba(239,206,148,0.010) 80%,rgba(239,206,148,0) 100%),
    radial-gradient(155px 131px at 23% 1217px,rgba(124,143,107,0.19) 0%,rgba(124,143,107,0.118) 34%,rgba(124,143,107,0.049) 60%,rgba(124,143,107,0.015) 80%,rgba(124,143,107,0) 100%),
    radial-gradient(153px 140px at 74% 1547px,rgba(237,31,39,0.17) 0%,rgba(237,31,39,0.105) 34%,rgba(237,31,39,0.044) 60%,rgba(237,31,39,0.014) 80%,rgba(237,31,39,0) 100%),
    radial-gradient(190px 97px at 19% 1943px,rgba(237,31,39,0.22) 0%,rgba(237,31,39,0.136) 34%,rgba(237,31,39,0.057) 60%,rgba(237,31,39,0.018) 80%,rgba(237,31,39,0) 100%),
    radial-gradient(158px 138px at 84% 2286px,rgba(157,176,137,0.2) 0%,rgba(157,176,137,0.124) 34%,rgba(157,176,137,0.052) 60%,rgba(157,176,137,0.016) 80%,rgba(157,176,137,0) 100%),
    radial-gradient(203px 101px at 41% 2634px,rgba(239,206,148,0.13) 0%,rgba(239,206,148,0.081) 34%,rgba(239,206,148,0.034) 60%,rgba(239,206,148,0.010) 80%,rgba(239,206,148,0) 100%),
    radial-gradient(186px 110px at 21% 3055px,rgba(124,143,107,0.19) 0%,rgba(124,143,107,0.118) 34%,rgba(124,143,107,0.049) 60%,rgba(124,143,107,0.015) 80%,rgba(124,143,107,0) 100%),
    radial-gradient(152px 134px at 74% 3418px,rgba(237,31,39,0.17) 0%,rgba(237,31,39,0.105) 34%,rgba(237,31,39,0.044) 60%,rgba(237,31,39,0.014) 80%,rgba(237,31,39,0) 100%),
    radial-gradient(164px 139px at 18% 3748px,rgba(237,31,39,0.22) 0%,rgba(237,31,39,0.136) 34%,rgba(237,31,39,0.057) 60%,rgba(237,31,39,0.018) 80%,rgba(237,31,39,0) 100%),
    radial-gradient(200px 121px at 88% 4164px,rgba(157,176,137,0.2) 0%,rgba(157,176,137,0.124) 34%,rgba(157,176,137,0.052) 60%,rgba(157,176,137,0.016) 80%,rgba(157,176,137,0) 100%),
    radial-gradient(181px 132px at 41% 4559px,rgba(239,206,148,0.13) 0%,rgba(239,206,148,0.081) 34%,rgba(239,206,148,0.034) 60%,rgba(239,206,148,0.010) 80%,rgba(239,206,148,0) 100%),
    radial-gradient(208px 113px at 28% 4885px,rgba(124,143,107,0.19) 0%,rgba(124,143,107,0.118) 34%,rgba(124,143,107,0.049) 60%,rgba(124,143,107,0.015) 80%,rgba(124,143,107,0) 100%),
    radial-gradient(175px 140px at 77% 5233px,rgba(237,31,39,0.17) 0%,rgba(237,31,39,0.105) 34%,rgba(237,31,39,0.044) 60%,rgba(237,31,39,0.014) 80%,rgba(237,31,39,0) 100%),
    radial-gradient(156px 127px at 7% 5583px,rgba(237,31,39,0.22) 0%,rgba(237,31,39,0.136) 34%,rgba(237,31,39,0.057) 60%,rgba(237,31,39,0.018) 80%,rgba(237,31,39,0) 100%),
    radial-gradient(182px 120px at 84% 6012px,rgba(157,176,137,0.2) 0%,rgba(157,176,137,0.124) 34%,rgba(157,176,137,0.052) 60%,rgba(157,176,137,0.016) 80%,rgba(157,176,137,0) 100%);
  background-repeat:no-repeat;
  filter:blur(16px);
  animation:dRespire 21s ease-in-out infinite alternate;
  will-change:opacity;
}
@keyframes dRespire{from{opacity:.66}to{opacity:1}}

/* --- le feuillage : trois plans, comme la page d'accueil --- */
.d-feuille{animation:dDerive 24s ease-in-out infinite alternate;will-change:transform}
/* Le feuillage est un ARRIERE-plan : il doit etre flou, comme sur la page
   d'accueil. Des feuilles nettes se lisent comme des formes posees sur la
   carte au lieu de profondeur. Les plans lointains sont plus flous. */
/* Le feuillage est un ARRIERE-plan : flou, comme sur la page d'accueil.
   Les plans lointains le sont davantage -- c'est ce qui donne la
   profondeur. */
.d-champ{position:absolute;left:0;top:0;width:100%;display:block}
.d-champ .d-loin  {filter:blur(9px);opacity:.62}
.d-champ .d-median{filter:blur(5.5px);opacity:.70}
.d-champ .d-proche{filter:blur(3px);opacity:.80}
/* les croquis a la craie restent lisibles mais s'adoucissent un peu */
.d-croqs{position:absolute;left:0;top:0;width:100%;display:block;filter:blur(.7px)}
.d-loin  {animation-duration:34s;animation-delay:-6s}
.d-median{animation-duration:28s;animation-delay:-15s}
.d-proche{animation-duration:22s;animation-delay:-2s}
@keyframes dDerive{
  0%  {transform:rotate(-1.8deg) translate(0,0)}
  50% {transform:rotate(.9deg)   translate(5px,-7px)}
  100%{transform:rotate(2.4deg)  translate(-4px,5px)}
}

/* --- les croquis a la craie : le comptoir dessine --- */
.d-croq{
  stroke:rgba(250,250,250,.30);stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round;
  animation:dVit 17s ease-in-out infinite alternate;
}
.d-croq.rouge{stroke:rgba(244,88,94,.42)}
.d-croq.vert {stroke:rgba(157,176,137,.46)}
.dq1{animation-delay:-1s}.dq2{animation-delay:-4s}.dq3{animation-delay:-7s}
.dq4{animation-delay:-10s}.dq5{animation-delay:-13s}.dq6{animation-delay:-16s}
.dq7{animation-delay:-3s}.dq8{animation-delay:-9s}
@keyframes dVit{from{opacity:1}to{opacity:.58}}

/* --- le grain : de la matiere, pas un aplat --- */
.d-voile{
  /* un voile etroit, seulement derriere la colonne de texte : les
     feuilles et les croquis vivent sur les marges, on n'y touche pas. */
  position:absolute;top:0;bottom:0;left:11%;right:11%;
  background:linear-gradient(90deg,
    transparent 0%, rgba(12,10,10,.30) 12%, rgba(12,10,10,.40) 50%,
    rgba(12,10,10,.30) 88%, transparent 100%);
}
/* Le couloir central (la ou passe le texte) restait vide : les feuilles
   longent les bords. On y pose une brume tres douce et tres faible --
   assez pour que le fond respire, jamais assez pour genner la lecture. */
.d-brume{
  position:absolute;inset:0;pointer-events:none;
  /* le couloir central, la ou passe le texte : une brume tres faible,

  .d-feuille,.d-lueur,.d-croq{animation:none!important;transform:none!important}
}

@keyframes feuilleIn{
  from{opacity:0;transform:translateY(16px) scale(.984)}
  to{opacity:1;transform:none}
}

/* ---- L'EN-TETE ---- */
.m-barre{
  position:sticky;top:0;z-index:6;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:clamp(10px,2.8vw,14px) clamp(12px,3.4vw,18px);
  background:linear-gradient(180deg,rgba(18,16,16,.97) 58%,rgba(18,16,16,0));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}

/* ---- LA GELULE FR/EN, EN BAMBOU ----
   Meme forme compacte que la version sombre, mais la pastille active est
   une lame de bambou : c'est la matiere du client. */
.m-lang{
  display:flex;gap:3px;padding:3px;border-radius:999px;
  background:rgba(0,0,0,.42);
  border:1px solid rgba(239,206,148,.34);
  box-shadow:0 2px 9px -3px rgba(0,0,0,.7);
}
.m-lang button{
  appearance:none;border:0;cursor:pointer;background:transparent;
  position:relative;min-height:34px;min-width:44px;
  padding:0 clamp(11px,3vw,14px);border-radius:999px;
  font-family:Jost,sans-serif;font-weight:600;font-size:clamp(10px,2.6vw,11px);
  letter-spacing:.16em;color:rgba(239,206,148,.72);
  transition:color .2s var(--doux),background .24s var(--doux);
}
/* zone tactile de 44px sans grossir la pastille visible */
.m-lang button::before{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:max(100%,44px);height:max(100%,44px);border-radius:999px;
}

.fermer{
  flex:none;width:44px;height:44px;border-radius:999px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(239,206,148,.3);background:rgba(0,0,0,.4);
  color:rgba(239,206,148,.9);font-size:15px;line-height:1;overflow:hidden;
  transition:transform .18s var(--ressort),background .22s ease;
}
.fermer:active{transform:scale(.92);background:rgba(239,206,148,.16)}

.m-logo{display:flex;justify-content:center;padding:0 clamp(16px,4.4vw,24px)}
.m-logo svg{width:min(210px,62%);height:auto;display:block;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.65))}
.m-filet{width:46px;height:2px;border-radius:2px;margin:clamp(11px,3vw,15px) auto 0;
  background:linear-gradient(90deg,transparent,var(--rouge),transparent)}

.m-corps{padding:0 clamp(13px,3.6vw,20px) clamp(14px,4vw,20px)}

/* ---- LE BANDEAU DE BAMBOU, avec l'assiette AU BOUT ----
   Exactement la disposition de leurs feuilles imprimees : la latte porte
   le titre a gauche, l'assiette deborde a droite. */
.sect{margin-top:clamp(22px,5.6vw,30px);scroll-margin-top:66px}
.sect:first-child{margin-top:clamp(14px,3.8vw,18px)}

.plank{
  position:relative;display:flex;align-items:center;
  min-height:clamp(38px,10vw,46px);
  padding:clamp(6px,1.8vw,9px) clamp(11px,3vw,15px);
  /* l'assiette deborde : on laisse la place a droite */
  padding-right:clamp(74px,20vw,92px);
  border-radius:4px;
  margin-bottom:clamp(10px,2.8vw,14px);
}
/* LE BOIS vit dans un ::before, PAS sur .plank : le masque de fondu ne
   doit ronger que la planche. Applique sur .plank, il effacerait aussi
   l'assiette et le titre, qui en sont des enfants. */
.plank::before{
  content:"";position:absolute;inset:0;z-index:0;
  border-radius:inherit;
  /* On fond vers TRANSPARENT, jamais vers une couleur : le fond de la
     carte est un degrade, une couleur figee ne collerait qu'a une seule
     hauteur de defilement. */

     l'alpha du masque. */
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.58));
}
.plank h3{
  position:relative;z-index:1;   /* au-dessus du bois */
  font-family:Jost,"Helvetica Neue",sans-serif;
  font-weight:700;font-style:italic;letter-spacing:.004em;text-transform:none;
  font-size:clamp(14px,3.9vw,17px);line-height:1.16;color:#17130D;
  text-shadow:0 1px 0 rgba(255,255,255,.34);
  display:flex;align-items:baseline;gap:.45em;flex-wrap:wrap;
}
.sec-note{
  font-family:Jost,sans-serif;font-style:italic;font-weight:400;
  font-size:.76em;letter-spacing:0;color:rgba(23,19,13,.72);white-space:nowrap;
}
/* l'assiette, posee au BOUT du bandeau */
.plank img{
  position:absolute;right:clamp(-30px,-7.5vw,-22px);
  top:50%;
  /* L'ASSIETTE SORT DE L'ECRAN : elle est plus grande que le bandeau,
     elle deborde par-dessus, et une ombre portee profonde + une lumiere
     rasante sur le bord la decollent franchement de la page. */
  width:clamp(104px,29vw,132px);height:clamp(104px,29vw,132px);
  object-fit:contain;display:block;z-index:3;
  transform:translateY(-50%) scale(1);
  transform-origin:center;
  filter:
    drop-shadow(0 2px 3px rgba(0,0,0,.55))
    drop-shadow(0 10px 16px rgba(0,0,0,.72))
    drop-shadow(0 22px 34px rgba(0,0,0,.60))
    drop-shadow(0 1px 0 rgba(255,236,200,.20));
  animation:assietteIn .52s var(--ressort) both;
  will-change:transform;
  /* L'assiette deborde du bandeau et retombe SUR le premier plat de la
     section — donc sur son bouton « + », dont elle mangeait 41 % de la
     surface tactile. Elle est purement decorative : elle ne doit jamais
     intercepter un doigt. */
  pointer-events:none;
}
@keyframes assietteIn{
  from{opacity:0;transform:translateY(-50%) scale(.86)}
  to  {opacity:1;transform:translateY(-50%) scale(1)}
}
/* le bandeau doit laisser passer l'assiette qui deborde */
.plank{overflow:visible}
@media (prefers-reduced-motion:reduce){
  .plank img{animation:none!important;transform:translateY(-50%)!important}
}

/* ======================================================================
   LA PRISE DE COMMANDE
   Ajoutee a la carte existante : le compteur a droite de chaque plat, la
   barre du bas, et l'ecran de confirmation. Rien du decor n'a bouge.
   ====================================================================== */

/* --- le compteur d'un plat --- */
.plat-ligne{display:flex;align-items:flex-start;gap:10px;
  margin-top:clamp(10px,2.8vw,14px);padding-bottom:clamp(8px,2.2vw,11px);
  border-bottom:1px solid rgba(250,250,250,.07)}
.plat-ligne:first-of-type{margin-top:0}
.plat-txt{flex:1;min-width:0}
.plat-txt .plat{margin-top:0}
.plat-txt .plat-d{margin-top:2px}

/* Pas d'`overflow:hidden` : il rognait les coins des boutons, et un doigt
   pose sur le coin arrondi du « + » ne touchait plus rien. Chaque bouton
   porte donc son propre arrondi. */
.qte{display:flex;align-items:center;flex:none;
  border:1px solid rgba(239,206,148,.28);border-radius:999px;
  background:rgba(0,0,0,.34)}
/* 44px : la cible tactile minimale confortable sur un telephone. */
.qte button{appearance:none;border:0;background:transparent;cursor:pointer;
  width:44px;height:44px;line-height:1;font-size:19px;color:#EFCE94;
  display:flex;align-items:center;justify-content:center;
  border-radius:999px;
  /* Un doigt vise mal : on elargit la zone sensible vers l'exterieur sans
     changer ce qui est dessine. */
  position:relative;z-index:1;
  transition:background .18s var(--doux)}
.qte .plus::after,.qte .moins::after{
  content:"";position:absolute;top:-6px;bottom:-6px;width:calc(100% + 10px)}
.qte .plus::after{left:-2px}
.qte .moins::after{right:-2px}
.qte button:active{background:rgba(237,31,39,.26)}
.qte .v{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;
  font-family:Jost,sans-serif;font-weight:600;font-size:14px;color:var(--creme)}
/* A zero, le « − » ne sert a rien : on le rend inerte plutot que de le cacher,
   pour que la largeur du compteur ne saute pas au premier ajout. */
.qte[data-zero="1"] .v{color:rgba(250,250,250,.32)}
.qte[data-zero="1"] .moins{opacity:.25;pointer-events:none}
.qte[data-zero="0"]{border-color:rgba(237,31,39,.55);background:rgba(237,31,39,.14)}

/* la barre du bas laisse voir le dernier plat : on reserve sa hauteur */
.papier{padding-bottom:0}
.m-corps{padding-bottom:clamp(104px,26vw,124px)}

/* --- la barre du bas --- */
.barre{position:absolute;left:0;right:0;bottom:0;z-index:8;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:11px clamp(12px,3.4vw,18px) calc(11px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(16,14,14,.86),rgba(16,14,14,.99));
  border-top:1px solid rgba(237,31,39,.34);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.barre .compte{width:100%;max-width:390px;display:flex;justify-content:space-between;
  align-items:baseline;font-family:Jost,sans-serif;font-size:12.5px;
  color:rgba(250,250,250,.72)}
.barre .compte b{color:var(--creme);font-weight:600}
.envoyer{width:100%;max-width:390px;min-height:54px;border:0;border-radius:13px;
  cursor:pointer;color:#fff;font-family:Oswald,sans-serif;font-weight:500;
  font-size:clamp(14px,4vw,16px);letter-spacing:.12em;text-transform:uppercase;
  background:linear-gradient(168deg,var(--rouge-doux),var(--rouge) 50%,var(--rouge-fonce));
  box-shadow:0 10px 24px -12px rgba(237,31,39,.8);
  transition:transform .18s var(--doux),opacity .2s}
.envoyer:active{transform:scale(.982)}
.envoyer:disabled{opacity:.34;box-shadow:none;cursor:default;transform:none}
.barre .avis{width:100%;max-width:390px;text-align:center;font-family:Jost,sans-serif;
  font-size:11.5px;line-height:1.45;color:#F4A0A4}
.barre .avis:empty{display:none}

/* ======================================================================
   LA GALERIE
   Le quadrillage clair est la piece maitresse : sans lui, des photos de
   nourriture posees bord a bord se fondent en une bouillie de couleurs.
   Chaque filet redonne a chaque plat son cadre.
   ====================================================================== */
/* Un noir mat, legerement metallique : la meme matiere que les assiettes
   des photos. Un noir pur ecraserait les ombres portees des cliches ; ce
   degrade tres sourd leur laisse de quoi se detacher. */
#galerie{position:fixed;inset:0;z-index:94;display:none;flex-direction:column;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(255,255,255,.05), transparent 60%),
    linear-gradient(176deg,#141416 0%,#0C0C0E 52%,#070708 100%)}
#galerie.ouvert{display:flex}
/* Sur iOS, un calque plein ecran n'empeche pas la page DESSOUS de defiler :
   un doigt qui glisse sur la galerie fait rebondir le fond. On bloque donc
   le document tant qu'un calque est ouvert. */
html.calque-ouvert,html.calque-ouvert body{overflow:hidden;
  overscroll-behavior:none;touch-action:none}
.gal-barre{flex:none;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:clamp(12px,3.2vw,16px) clamp(13px,3.6vw,18px);
  padding-top:calc(clamp(12px,3.2vw,16px) + env(safe-area-inset-top,0px));
  border-bottom:1px solid rgba(250,250,250,.09);background:rgba(10,10,12,.96)}
.gal-titre{font-family:Oswald,sans-serif;font-weight:500;font-size:clamp(15px,4vw,18px);
  letter-spacing:.17em;text-transform:uppercase;color:var(--creme)}
.gal-defile{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:clamp(10px,3vw,16px) clamp(8px,2.4vw,16px)
          calc(clamp(14px,4vw,20px) + env(safe-area-inset-bottom,0px))}

/* Deux colonnes sur un telephone, davantage des qu'il y a la place : une
   photo de plat sous 150 px ne montre plus rien. */
/* TROIS COLONNES, toujours : neuf photos forment un carre 3x3 net, sur un
   telephone comme sur un ecran. Plafonnee en largeur pour qu'un grand ecran
   ne les etire pas au-dela du raisonnable. */
.gal-grille{display:grid;gap:clamp(7px,2vw,12px);max-width:940px;margin:0 auto;
  grid-template-columns:repeat(3,1fr)}
/* L'ENCADREMENT, en deux traits — comme une photo sous passe-partout :
   un filet sombre sur l'arete meme du cliche, puis un trait blanc pose en
   RETRAIT a l'interieur. C'est ce second trait qui fait le cadre ; seul,
   le premier ne serait qu'une bordure. */
.gal-case{position:relative;display:block;padding:0;cursor:pointer;
  aspect-ratio:1;overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
  background:#0C0C0E;
  transition:transform .22s var(--doux)}
.gal-case::after{
  content:"";position:absolute;z-index:2;pointer-events:none;
  inset:clamp(5px,1.7vw,9px);
  border:1px solid rgba(255,255,255,.82);
}
/* Les photos sont cadrees large, l'assiette flottant au centre d'un grand
   fond blanc. Recadrees telles quelles en carre, les plats paraissent
   minuscules. On zoome donc un peu pour manger la marge inutile — sans
   toucher au fichier, qui reste entier pour l'agrandissement. */
.gal-case img{width:100%;height:100%;object-fit:cover;display:block;
  transform:scale(1.22);transform-origin:center;
  transition:transform .4s var(--doux)}
.gal-case:active{transform:scale(.97)}
@media (hover:hover){ .gal-case:hover img{transform:scale(1.3)} }

/* --- la photo en grand --- */
#loupe{position:fixed;inset:0;z-index:98;display:none;
  align-items:center;justify-content:center;
  background:rgba(8,7,7,.97);
  padding:56px 12px calc(56px + env(safe-area-inset-bottom,0px))}
#loupe.ouvert{display:flex}
#loupeImg{max-width:100%;max-height:100%;object-fit:contain;display:block;
  border:3px solid rgba(250,250,250,.9);
  box-shadow:0 20px 60px -20px rgba(0,0,0,.95);
  animation:loupeIn .26s var(--doux)}
@keyframes loupeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.loupe-fermer{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;
  width:44px;height:44px;border-radius:999px;cursor:pointer;z-index:2;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--ligne);background:rgba(0,0,0,.6);color:var(--creme);font-size:15px}
.loupe-fleche{position:absolute;top:50%;transform:translateY(-50%);
  width:48px;height:48px;border-radius:999px;cursor:pointer;z-index:2;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--ligne);background:rgba(0,0,0,.55);color:var(--creme);
  font-size:30px;line-height:1;padding-bottom:4px}
.loupe-fleche.gauche{left:10px}
.loupe-fleche.droite{right:10px}
.loupe-fleche:active{background:rgba(237,31,39,.32)}
.loupe-compte{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  left:0;right:0;text-align:center;font-family:Jost,sans-serif;font-size:12px;
  letter-spacing:.14em;color:var(--creme-dim);font-variant-numeric:tabular-nums}

/* SUR UN TELEPHONE : le 3x3 occupe tout l'ecran, sans defilement ni marge.
   Les neuf photos se voient d'un seul coup d'oeil, bord a bord, et les
   traits blancs en retrait forment le quadrillage. Au-dela (tablette,
   portable), on garde la grille centree en vignettes carrees. */
@media (max-width:640px){
  .gal-defile{padding:0;overflow:hidden;display:flex}
  .gal-grille{max-width:none;width:100%;height:100%;gap:0;margin:0;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr)}
  /* La hauteur vient de la grille, plus du rapport 1:1. */
  .gal-case{aspect-ratio:auto;border-width:0;
    border-right:1px solid rgba(255,255,255,.10);
    border-bottom:1px solid rgba(255,255,255,.10)}
  .gal-case:nth-child(3n){border-right:0}
  .gal-case:nth-child(n+7){border-bottom:0}
}

@media (prefers-reduced-motion:reduce){
  .gal-case,.gal-case img,#loupeImg{transition:none!important;animation:none!important}
}

/* ======================================================================
   LES PANNEAUX : relecture, puis prenom.
   Meme habillage pour les deux — le client doit sentir qu'il avance dans
   une seule sequence, pas qu'il saute d'un ecran a un autre.
   ====================================================================== */
#revue,#nomEtape{position:fixed;inset:0;z-index:96;display:none;
  align-items:center;justify-content:center;padding:18px;
  background:rgba(10,9,9,.80);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
#revue.ouvert,#nomEtape.ouvert{display:flex}
.panneau{position:relative;width:100%;max-width:380px;max-height:100%;
  overflow-y:auto;overscroll-behavior:contain;
  border-radius:18px;padding:26px 22px 20px;
  border:1px solid rgba(239,206,148,.22);
  background:linear-gradient(172deg,#221E1F,#141112);
  box-shadow:0 30px 70px -26px rgba(0,0,0,.92);
  animation:nomIn .34s var(--ressort)}
@keyframes nomIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
/* un filet rouge en haut, comme sur la carte */
.nom-motif{position:absolute;top:0;left:0;right:0;height:3px;border-radius:18px 18px 0 0;
  background:linear-gradient(90deg,transparent,var(--rouge),var(--bambou-clair),transparent)}
.panneau h2{font-family:Oswald,sans-serif;font-weight:500;font-size:21px;
  letter-spacing:.06em;text-transform:uppercase;text-align:center;color:var(--creme)}
.panneau-quoi{margin-top:7px;text-align:center;font-family:Jost,sans-serif;font-weight:300;
  font-size:12.5px;line-height:1.5;color:rgba(250,250,250,.62)}

/* --- la relecture --- */
.revue-liste{margin-top:18px;border-top:1px solid rgba(239,206,148,.18)}
.revue-ligne{display:flex;align-items:flex-start;gap:12px;padding:11px 2px;
  border-bottom:1px solid rgba(250,250,250,.07)}
.revue-ligne b{flex:none;min-width:30px;font-family:Oswald,sans-serif;font-weight:500;
  font-size:18px;color:var(--rouge-doux);font-variant-numeric:tabular-nums}
.revue-ligne span{flex:1;min-width:0;font-family:Jost,sans-serif;font-weight:600;
  font-size:14px;line-height:1.3;color:var(--creme)}
.revue-ligne small{display:block;margin-top:2px;font-family:Jost,sans-serif;font-weight:300;
  font-size:11px;color:rgba(250,250,250,.5)}
.revue-total{display:flex;justify-content:space-between;align-items:baseline;
  margin:14px 0 18px;padding-top:12px;border-top:2px solid rgba(239,206,148,.3);
  font-family:Jost,sans-serif;font-size:12.5px;letter-spacing:.06em;
  text-transform:uppercase;color:rgba(250,250,250,.6)}
.revue-total b{font-family:Oswald,sans-serif;font-size:20px;font-weight:500;color:var(--creme)}

.panneau-retour{margin-top:9px;width:100%;min-height:44px;cursor:pointer;
  border:0;background:none;color:rgba(250,250,250,.5);
  font-family:Jost,sans-serif;font-size:12.5px}

/* ======================================================================
   LA TRANSITION — un ticket qui sort de l'imprimante.
   Elle montre ce qui se passe vraiment a cet instant, plutot que de faire
   tourner un rond generique. Elle tient aussi un role concret : l'envoi
   dure parfois 200 ms, et un recu qui apparaitrait d'un coup donnerait
   l'impression d'un faux. On lui laisse le temps d'etre lu.
   ====================================================================== */
#chargement{position:fixed;inset:0;z-index:97;display:none;
  align-items:center;justify-content:center;
  background:radial-gradient(60% 40% at 50% 45%,#221E1F,#0E0C0C)}
#chargement.ouvert{display:flex}
.charge-in{display:flex;flex-direction:column;align-items:center;gap:20px}

.imprimante{position:relative;width:132px;height:112px}
/* le corps de l'imprimante, au premier plan : le ticket sort de derriere */
.imp-corps{position:absolute;left:0;top:0;width:132px;height:44px;border-radius:9px;
  background:linear-gradient(176deg,#3A3334,#1E1A1B);
  box-shadow:0 5px 16px -6px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.09) inset;z-index:2}
.imp-fente{position:absolute;left:14px;top:34px;width:104px;height:4px;border-radius:3px;
  background:#0B0A0A;box-shadow:0 1px 0 rgba(255,255,255,.07);z-index:3}
/* le ticket : il descend, s'arrete, repart */
.imp-ticket{position:absolute;left:20px;top:22px;width:92px;height:74px;border-radius:2px;
  background:
    repeating-linear-gradient(180deg,transparent 0 9px,rgba(43,38,39,.16) 9px 10px),
    linear-gradient(#FCFAF6,#EFEAE0);
  box-shadow:0 8px 18px -8px rgba(0,0,0,.75);z-index:1;
  transform-origin:top center;
  animation:sortTicket 1.9s cubic-bezier(.45,.05,.25,1) infinite}
@keyframes sortTicket{
  0%   {transform:translateY(-72px) scaleY(.2);opacity:0}
  22%  {opacity:1}
  62%  {transform:translateY(0) scaleY(1);opacity:1}
  86%  {transform:translateY(0) scaleY(1);opacity:1}
  100% {transform:translateY(10px) scaleY(1);opacity:0}
}
.charge-texte{font-family:Oswald,sans-serif;font-weight:400;font-size:15px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--creme);text-align:center}
.charge-points{display:flex;gap:7px}
.charge-points i{width:6px;height:6px;border-radius:50%;background:var(--rouge);
  animation:pointe 1.1s ease-in-out infinite}
.charge-points i:nth-child(2){animation-delay:.16s}
.charge-points i:nth-child(3){animation-delay:.32s}
@keyframes pointe{0%,100%{opacity:.22;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

/* Mouvement reduit : on garde l'information, on retire l'agitation. */
@media (prefers-reduced-motion:reduce){
  .imp-ticket{animation:none;transform:none}
  .charge-points i{animation:none;opacity:.7}
  .panneau{animation:none}
}
#nomChamp{width:100%;margin-top:18px;min-height:54px;padding:0 16px;
  border-radius:12px;border:1px solid rgba(239,206,148,.3);
  background:rgba(0,0,0,.4);color:var(--creme);
  font-family:Jost,sans-serif;font-weight:500;
  /* 16px minimum : en dessous, iOS zoome tout seul a la mise au point et
     le client se retrouve avec une page a moitie hors ecran. */
  font-size:16px;letter-spacing:.02em;text-align:center}
#nomChamp::placeholder{color:rgba(250,250,250,.3);font-weight:300}
#nomChamp:focus{outline:none;border-color:var(--rouge-doux);
  box-shadow:0 0 0 3px rgba(237,31,39,.18)}
.nom-erreur{margin-top:9px;text-align:center;font-family:Jost,sans-serif;
  font-size:12px;line-height:1.4;color:#F4A0A4;min-height:16px}
.nom-boite .envoyer{margin-top:4px}
.nom-retour{margin-top:9px;width:100%;min-height:44px;cursor:pointer;
  border:0;background:none;color:rgba(250,250,250,.5);
  font-family:Jost,sans-serif;font-size:12.5px}

/* ======================================================================
   LE RECU — en CLAIR, volontairement.
   Il est brandi a bout de bras, de biais, parfois en plein jour. Le fond
   sombre du menu est plus beau mais se lit mal dans ces conditions : ici
   la lisibilite passe devant. La marque revient autrement — le logo, le
   rouge, les polices, et le bord dentele d'un vrai ticket.
   ====================================================================== */
#recu{position:fixed;inset:0;z-index:95;display:none;color:#151314;
  overflow-y:auto;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(70% 40% at 50% 0%,#F0E7D8,#E4DACB 60%,#DCD2C2 100%)}
#recu.ouvert{display:block}
.recu-in{width:100%;max-width:392px;margin:0 auto}

/* --- le papier et ses bords dentelés --- */
.ticket-papier{position:relative;animation:ticketIn .46s var(--ressort)}
@keyframes ticketIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.ticket-corps{position:relative;background:#FCFAF6;padding:24px 22px 20px;
  box-shadow:0 20px 44px -22px rgba(40,30,20,.55);
  /* une trame très légère : du papier, pas un aplat d'écran */
  background-image:
    repeating-linear-gradient(0deg,rgba(43,38,39,.022) 0 1px,transparent 1px 3px),
    linear-gradient(#FCFAF6,#FCFAF6)}
/* Le bord dentelé d'un ticket déchiré, en dégradés coniques : aucune image,
   et il s'adapte à toutes les largeurs. */
.dentelle{height:9px;
  background:radial-gradient(circle at 5px 0, transparent 5px, #FCFAF6 5px) repeat-x;
  background-size:10px 9px;
  filter:drop-shadow(0 0 0 rgba(0,0,0,0))}
.dentelle.haut{transform:rotate(180deg)}
.dentelle.bas{margin-top:0}

.r-logo{display:flex;justify-content:center;margin-bottom:14px}
.r-logo svg{width:min(150px,54%);height:auto;display:block}
/* Le logo est concu pour un fond noir : son lettrage est blanc. Sur le
   papier clair du recu on REPEINT le lettrage en encre, sans toucher au
   groupe rouge. Un filter:invert() aurait aussi retourne le rouge du koi,
   qui serait ressorti en turquoise. */
.r-logo svg g[fill="#FAFAFA"]{fill:#151314}

.recu-in .quoi{text-align:center;font-family:Jost,sans-serif;font-size:10.5px;
  letter-spacing:.3em;text-transform:uppercase;color:#9A8F7E}

.r-numero{text-align:center;margin-top:2px}
.recu-in .no{font-family:Oswald,sans-serif;font-weight:600;font-size:66px;
  line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums;color:#151314}
.r-nom{margin-top:2px;font-family:Oswald,sans-serif;font-weight:400;
  font-size:25px;letter-spacing:.07em;text-transform:uppercase;color:var(--rouge-fonce)}
/* La date en capitales, dans la meme graisse condensee que les titres de
   la carte : elle se lit comme une mention de ticket, pas comme une phrase. */
.recu-in .quand{text-align:center;margin-top:9px;
  font-family:Oswald,"Arial Narrow",sans-serif;font-weight:400;
  font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;color:#8A8073}

/* LA LIGNE D'ETAT — elle ne parle que quand il y a un probleme.
   Confirmer « bien recue » a chaque commande n'apprend rien : c'est le cas
   normal. En revanche un ticket qui n'est PAS sorti doit se voir, sinon le
   client se presente au comptoir avec un numero que la cuisine n'a pas.
   L'etat reel reste porte par data-etat, seul l'affichage est filtre. */
.etat{display:none;margin:16px 0 0;padding:12px 15px;border-radius:9px;
  font-family:Jost,sans-serif;font-size:13px;line-height:1.55;text-align:center}
.etat[data-etat="rate"]{display:block;background:#FBEAEA;color:#A11B1B;font-weight:600;
  border:1px solid rgba(161,27,27,.3)}

/* LA CONSIGNE — la seule chose a retenir en quittant l'ecran.
   C'est le CADRE qui attire l'oeil : fond teinte, filet rouge sur le
   flanc. Le texte, lui, reste en italique et d'un seul tenant — ni
   soulignement ni surlignage mot a mot, qui hacheraient la lecture de la
   seule phrase qu'il faut lire en entier. */
.appel{margin-top:14px;padding:15px 17px;border-radius:10px;
  background:rgba(237,31,39,.09);
  border:1px solid rgba(192,22,28,.3);
  border-left:5px solid var(--rouge);
  font-family:Jost,sans-serif;font-style:italic;font-weight:400;
  font-size:13.5px;line-height:1.65;
  text-align:center;color:#8E1318;
  box-shadow:0 2px 12px -6px rgba(192,22,28,.45)}

.r-titre-liste{display:flex;align-items:baseline;justify-content:space-between;
  margin-top:20px;padding-bottom:7px;border-bottom:2px solid #151314;
  font-family:Jost,sans-serif;font-size:10.5px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:#151314}
.r-compte{font-weight:400;letter-spacing:.06em;color:#8A8073;text-transform:none}

.recu-in table{width:100%;border-collapse:collapse}
.recu-in td{padding:10px 0;border-bottom:1px dotted rgba(43,38,39,.26);vertical-align:top}
.recu-in tr:last-child td{border-bottom:0}
.recu-in td.q{width:46px;font-family:Oswald,sans-serif;font-size:19px;font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--rouge-fonce)}
.recu-in td.n{font-family:Jost,sans-serif;font-size:14.5px;font-weight:600;line-height:1.3;
  color:#151314}
.recu-in td.n small{display:block;font-size:11px;font-weight:400;color:#8A8073;margin-top:2px}

/* « Paiement au comptoir » : la seconde chose a retenir, apres la
   consigne d'appel. Assez grande pour etre lue sans y revenir. */
.recu-in .note{margin-top:18px;padding-top:15px;border-top:1px solid rgba(43,38,39,.14);
  font-family:Jost,sans-serif;font-weight:500;font-size:16px;line-height:1.45;
  letter-spacing:.01em;color:#3A3330;text-align:center}
.r-adresse{margin-top:10px;text-align:center;font-family:Jost,sans-serif;
  font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#A89C8A}

.recu-in .rentrer{margin-top:16px;width:100%;min-height:50px;cursor:pointer;
  border:1px solid rgba(43,38,39,.22);border-radius:12px;
  background:rgba(255,255,255,.55);color:#3A3330;
  font-family:Jost,sans-serif;font-size:14px;font-weight:600}
.recu-in .rentrer:active{background:rgba(255,255,255,.9)}

@media (prefers-reduced-motion:reduce){
  .ticket-papier,.nom-boite{animation:none}
}

@media (prefers-reduced-motion:reduce){
  #noren{display:none}
  .carte,.monte{opacity:1!important;transform:none!important;animation:none!important}
  .encre,.lanterne,.feuille,.menu::after,.fleche{animation:none!important}
  .croq{animation:none!important;opacity:.8!important;transform:none!important}
  .papier{animation:none!important}
  *{transition-duration:.01ms!important}
}

  <!-- feuilles de bambou : la nature, cote japonais. Trois plans de
       profondeur : les plus proches sont plus grandes, plus opaques et

     ====================================================================== -->

  </div>
</div>

<!-- La photo en grand, une fois qu'on en a touche une. -->
<div id="loupe" role="dialog" aria-modal="true" aria-label="Photo">
  <button class="loupe-fermer" id="loupeFermer" type="button" aria-label="Fermer">✕</button>
  <button class="loupe-fleche gauche" id="loupePrec" type="button" aria-label="Photo précédente">‹</button>
  <img id="loupeImg" alt="">
  <button class="loupe-fleche droite" id="loupeSuiv" type="button" aria-label="Photo suivante">›</button>
  <div class="loupe-compte" id="loupeCompte"></div>
</div>

<!-- ======================================================================
     L'ETAPE DE RELECTURE — on relit sa commande avant de la lancer.
     Une commande partie est imprimee en cuisine dans la seconde : il n'y a
     pas de « annuler » possible. Ce coup d'oeil est le dernier moment ou
     une erreur coute encore zero.
     ====================================================================== -->
<div id="revue" role="dialog" aria-modal="true" aria-labelledby="revueTitre">
  <div class="panneau">
    <div class="nom-motif" aria-hidden="true"></div>
    <h2 id="revueTitre"></h2>
    <p class="panneau-quoi" id="revueQuoi"></p>

    <div class="revue-liste" id="revueListe"></div>

    <div class="revue-total">
      <span id="revueTotalLib"></span><b id="revueTotal"></b>
    </div>

    <button class="envoyer" id="revueConfirmer" type="button"></button>
    <button class="panneau-retour" id="revueModifier" type="button"></button>
  </div>
</div>

<!-- ======================================================================
     LA TRANSITION — pendant que le ticket part en cuisine.
     Un ticket qui sort d'une imprimante : ce qui se passe reellement a
     cet instant-la, montre plutot qu'ecrit.
     ====================================================================== -->
<div id="chargement" role="status" aria-live="polite">
  <div class="charge-in">
    <div class="imprimante" aria-hidden="true">
      <div class="imp-ticket"></div>
      <div class="imp-corps"></div>
      <div class="imp-fente"></div>
    </div>
    <p class="charge-texte" id="chargeTexte"></p>
    <div class="charge-points" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
</div>

<!-- ======================================================================
     L'ETAPE DU PRENOM — demandee juste avant l'envoi.
     Au dernier moment volontairement : personne ne donne son prenom pour
     regarder un menu, mais tout le monde l'accepte une fois la commande
     prete a partir.
     ====================================================================== -->
<div id="nomEtape" role="dialog" aria-modal="true" aria-labelledby="nomTitre">
  <div class="panneau">
    <div class="nom-motif" aria-hidden="true"></div>
    <h2 id="nomTitre"></h2>
    <p class="panneau-quoi" id="nomQuoi"></p>

    <input id="nomChamp" type="text" maxlength="30"
           autocomplete="given-name" autocapitalize="words"
           spellcheck="false" enterkeyhint="done">
    <p class="nom-erreur" id="nomErreur" role="alert"></p>

    <button class="envoyer" id="nomValider" type="button"></button>
    <button class="panneau-retour" id="nomAnnuler" type="button"></button>
  </div>
</div>

<!-- ======================================================================
     LE RECU — ce que le client montre au comptoir.
     En clair, volontairement : il est brandi a bout de bras, de biais,
     parfois en plein jour. La lisibilite passe avant l'ambiance sombre du
     menu. La marque revient par le logo, le rouge, les polices et le
     bord dentele du papier.
     ====================================================================== -->
<div id="recu" role="dialog" aria-modal="true" aria-label="Votre commande">
  <div class="recu-in">

    <div class="ticket-papier">
      <div class="dentelle haut" aria-hidden="true"></div>

      <div class="ticket-corps">
        <div class="r-logo" id="rLogo" aria-hidden="true"></div>

        <div class="quoi" id="rQuoi"></div>

        <div class="r-numero">
          <div class="no" id="rNo">—</div>
          <div class="r-nom" id="rNom"></div>
        </div>

        <div class="quand" id="rQuand"></div>

        <p class="etat" id="rEtat" data-etat="attente" role="status"></p>

        <!-- La consigne, en evidence : c'est la seule chose que le client
             doit RETENIR en quittant l'ecran. -->
        <div class="appel" id="rAppel"></div>

        <div class="r-titre-liste">
          <span id="rTitreListe"></span><span class="r-compte" id="rCompte"></span>
        </div>
        <table id="rTable"></table>

        <p class="note" id="rNote"></p>
        <div class="r-adresse" id="rAdresse"></div>
      </div>

      <div class="dentelle bas" aria-hidden="true"></div>
    </div>

    <button class="rentrer" id="rRentrer" type="button"></button>
  </div>
</div>

/* ==========================================================================
   LA CARTE — transcrite mot pour mot des DEUX feuilles imprimees completes
   du client (pages 1 et 2). Chaque description est la liste complete des
   ingredients telle qu'elle figure sur la feuille : rien d'abrege, rien
   d'invente.

   ATTENTION : d'autres versions des feuilles portent encore la mention
   « (Description) » a la place de certains poke bols. Ce sont des gabarits
   non remplis par le graphiste : on ne s'en sert pas.

   POUR AJOUTER DES PRIX PLUS TARD :
       { fr:"Saumon", en:"Salmon", p:"19 $" }
   Le prix apparait a droite avec les pointilles. Sans "p", la ligne
   s'affiche simplement sans prix.

   L'IMAGE D'UNE SECTION : champ "img" (une seule par section), affichee
   au BOUT du bandeau de bambou, comme sur les feuilles imprimees.
   ========================================================================== */

/* ======================================================================
   LA CARTE arrive du serveur, injectee dans le <head> depuis src/menu.js.
   Il n'y a donc qu'UNE carte dans tout le projet : celle que le serveur
   valide et imprime. La page ne peut pas proposer un plat qu'il refuserait,
   ni afficher un nom que le ticket de cuisine n'aurait pas.
   Pour modifier la carte : editer src/menu.js.
   ====================================================================== */
const CARTE = window.COMPTOIR_MENU ?? [];

const CONFIG = {
  nom:        "Le Comptoir Sushi 36 & Prêt à Manger",
  lieu:       "Vieux-Montréal",
  adresse:    "36 rue Notre-Dame Est, Montréal, QC H2Y 1B9",
  /* « Commander » plutot que « Menu » : le bouton ouvre desormais une carte
     ou l'on compose sa commande, et il vaut mieux le dire avant le tap. */
  menuTexte:  "Commander",
  defile:     ["Poké bol","Sushi pizza","Makis de printemps","Futomakis",
               "Hosomakis","Nigiris sushi","Gunkan nigiris","Tartare de printemps",
               "Spécialité du chef","Plateaux","Soupes & salades","Futomakis frits"],
  mTeteSous:  "Le Comptoir Sushi 36",
  instagramUrl:"https://www.instagram.com/explore/locations/1758382781084509/le-comptoir-sushi-pret-a-manger/",
  facebookUrl:"https://www.facebook.com/lecomptoirsushi",
  mapsUrl:    "https://www.google.com/maps/search/?api=1&query=Le+Comptoir+Sushi+36%2C+36+rue+Notre-Dame+Est%2C+Montr%C3%A9al%2C+QC+H2Y+1B9",
  menuTexteEn:"Menu"
};

const $ = id => document.getElementById(id);
$('lieu').textContent      = CONFIG.lieu;
$('menuTexte').textContent = CONFIG.menuTexte;
$('adresse').textContent   = CONFIG.adresse;
$('adresse').href          = CONFIG.mapsUrl;
$('mAdr').textContent      = CONFIG.adresse;

const REDUIT = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Le decor doit couvrir TOUTE la longueur du menu, pas seulement le
   premier ecran : on lui donne la hauteur reelle de defilement. */
function ajusterDeco(){
  const pa = document.getElementById('papier');
  const de = pa && pa.querySelector('.deco');
  if (!pa || !de) return;
  const H = pa.scrollHeight;
  de.style.height = H + 'px';
  /* Le decor est UNE seule nappe continue, jamais des tuiles : rien n'est
     donc coupe a une jonction. On etire simplement sa hauteur sur toute la
     carte, en gardant le rapport du viewBox pour ne pas deformer. */
  const L = pa.clientWidth || pa.getBoundingClientRect().width || 400;
  if (!H || !L) return;                 /* pas encore de mise en page */
  de.querySelectorAll('svg.d-champ, svg.d-croqs').forEach(s => {
    s.style.height = H + 'px';
    /* le viewBox suit la hauteur reelle : les feuilles gardent leurs
       proportions et la nappe couvre exactement la carte. */
    s.setAttribute('viewBox', '0 0 400 ' + Math.round(H * 400 / L));
  });
}

window.addEventListener('resize', ajusterDeco);


const noren = $('noren');
if (REDUIT) noren.classList.add('parti');
else setTimeout(() => noren.classList.add('parti'), 1620);

/* ======================================================================
   LA GALERIE
   Les photos viennent du serveur, qui liste simplement `public/galerie/`.
   Deposer un fichier dans ce dossier suffit a l'ajouter ici : aucun code a
   toucher pour changer la vitrine avant un service.
   ====================================================================== */

/* La langue est declaree ici, avant tout ce qui la lit : la galerie comme
   la carte composent leurs libelles des l'evaluation du script. */
let LANGUE = 'fr';

const PHOTOS = window.COMPTOIR_GALERIE ?? [];

const GAL_TXT = {
  fr: { titre:'Galerie', bouton:'Galerie' },
  en: { titre:'Gallery', bouton:'Gallery' }
};

/* Un nom de fichier fait un texte alternatif utilisable : « 02-poke-bol.jpg »
   devient « poke bol ». Mieux qu'un alt vide pour qui navigue au lecteur
   d'ecran, et cela ne demande aucune saisie supplementaire au commerce. */
function alternatif(fichier){
  return fichier
    .replace(/\.[^.]+$/, '')
    .replace(/^\d+[-_\s]*/, '')
    .replace(/[-_]+/g, ' ')
    .trim() || 'Photo';
}

function construireGalerie(){
  if (PHOTOS.length === 0) return;

  $('galTitre').textContent = GAL_TXT[LANGUE].titre;

  $('galGrille').innerHTML = PHOTOS.map((f, i) =>
    '<button class="gal-case" type="button" data-i="' + i + '">'
    /* La GRILLE prend la vignette : neuf photos de studio en pleine
       resolution feraient attendre des dizaines de secondes pour des images
       affichees grandes comme un timbre. `loading="lazy"` evite en plus de
       charger ce qui est hors ecran. */
    + '<img src="/galerie/vignettes/' + encodeURIComponent(f) + '" alt="' + ech(alternatif(f)) + '"'
    + ' loading="lazy" decoding="async">'
    + '</button>'
  ).join('');
}

/** Reporte la langue courante sur les libelles de la galerie. */
function majGalerie(){
  if (PHOTOS.length === 0) return;
  $('galTitre').textContent = GAL_TXT[LANGUE].titre;
  const bouton = document.querySelector('#liens .lien span');
  if (bouton) bouton.textContent = GAL_TXT[LANGUE].bouton;
}

function ouvrirGalerie(){
  construireGalerie();
  document.documentElement.classList.add('calque-ouvert');
  $('galerie').classList.add('ouvert');
  $('galerie').querySelector('.gal-defile').scrollTop = 0;
  $('galFermer').focus({preventScroll:true});
}

function fermerGalerie(){
  $('galerie').classList.remove('ouvert');
  document.documentElement.classList.remove('calque-ouvert');
}

$('galFermer').addEventListener('click', fermerGalerie);

/* ---------- la photo en grand ---------- */

let photoCourante = 0;

function ouvrirLoupe(i){
  photoCourante = (i + PHOTOS.length) % PHOTOS.length;

  /* L'AGRANDISSEMENT prend la pleine resolution : c'est le seul moment ou
     elle se voit, et on n'en charge qu'une a la fois. */
  $('loupeImg').src = '/galerie/' + encodeURIComponent(PHOTOS[photoCourante]);
  $('loupeImg').alt = alternatif(PHOTOS[photoCourante]);
  $('loupeCompte').textContent = (photoCourante + 1) + ' / ' + PHOTOS.length;

  /* Une seule photo : les fleches n'ont nulle part ou aller. */
  const plusieurs = PHOTOS.length > 1;
  $('loupePrec').hidden = !plusieurs;
  $('loupeSuiv').hidden = !plusieurs;

  $('loupe').classList.add('ouvert');
}

function fermerLoupe(){
  $('loupe').classList.remove('ouvert');
  $('loupeImg').removeAttribute('src');   /* libere la grande image */
}

$('galGrille').addEventListener('click', e => {
  const case_ = e.target.closest('.gal-case');
  if (case_) ouvrirLoupe(Number(case_.dataset.i));
});

$('loupeFermer').addEventListener('click', fermerLoupe);
$('loupePrec').addEventListener('click', () => ouvrirLoupe(photoCourante - 1));
$('loupeSuiv').addEventListener('click', () => ouvrirLoupe(photoCourante + 1));

/* Toucher le fond ferme : le geste qu'on tente d'instinct. */
$('loupe').addEventListener('click', e => { if (e.target === $('loupe')) fermerLoupe(); });

/* Le balayage lateral, attendu de tous sur un telephone. */
let departX = null;
$('loupe').addEventListener('touchstart', e => { departX = e.changedTouches[0].clientX; }, {passive:true});
$('loupe').addEventListener('touchend', e => {
  if (departX === null) return;
  const parcouru = e.changedTouches[0].clientX - departX;
  departX = null;
  /* 45 px : assez pour ne pas confondre avec un simple appui. */
  if (Math.abs(parcouru) > 45) ouvrirLoupe(photoCourante + (parcouru < 0 ? 1 : -1));
});

addEventListener('keydown', e => {
  if ($('loupe').classList.contains('ouvert')){
    if (e.key === 'Escape') fermerLoupe();
    if (e.key === 'ArrowLeft') ouvrirLoupe(photoCourante - 1);
    if (e.key === 'ArrowRight') ouvrirLoupe(photoCourante + 1);
    return;
  }
  if (e.key === 'Escape' && $('galerie').classList.contains('ouvert')) fermerGalerie();
});

/* ======================================================================
   LA CARTE, en deux langues. On rend tout une fois puis on bascule
   FR/EN sans recharger.
   LES PRIX : un plat qui porte un champ "p" affiche les pointilles et
   son montant. Sans "p", la ligne s'affiche sans prix. On peut donc en
   ajouter plus tard, un par un, sans toucher a la mise en page.
   ====================================================================== */
const corps = $('mCorps');
const texte = (o, cle) => LANGUE === 'fr' ? o[cle+'Fr'] : o[cle+'En'];

/* le logo de la page, clone en tete de carte a la premiere ouverture */
function poserLogo(){
  const cible = $('mLogo');
  if (!cible || cible.childElementCount) return;
  const src = document.querySelector('#marque svg');
  if (src) cible.appendChild(src.cloneNode(true));
}

/* ======================================================================
   LA PRISE DE COMMANDE
   ======================================================================
   Le panier vit ICI, dans une Map, jamais dans le DOM : basculer FR/EN
   reconstruit toute la carte, et un panier lu depuis le DOM disparaitrait
   a chaque bascule.

   Le NUMERO de commande vient toujours du serveur. La page n'en invente
   jamais : un numero affiche sans commande enregistree enverrait un client
   au comptoir avec un numero que personne ne peut retrouver.
   ====================================================================== */

const TXT = {
  fr: {
    ajouter:'Ajouter', retirer:'Retirer',
    vide:'Votre commande est vide', article:'article', articles:'articles',
    aide:'Ajoutez des plats', pret:'Prêt à envoyer',
    envoyer:'Envoyer ma commande', envoi:'Envoi en cours…',
    quoi:'Commande', recu:'Votre commande',
    note:'Paiement au comptoir.',
    rentrer:'← Revenir au menu',
    revueTitre:'Vérifiez votre commande',
    revueQuoi:'Une fois envoyée, elle part directement en cuisine.',
    revueTotal:'Total', revueConfirmer:'Confirmer',
    revueModifier:'← Modifier ma commande',
    chargeTexte:'Envoi en cuisine',
    nomTitre:'À quel nom ?', nomChamp:'Votre prénom',
    nomQuoi:'Le comptoir appellera votre prénom ou votre numéro quand ce sera prêt.',
