<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Comptoir — Commandes</title>
<style>
/* Un ecran de travail, lu de biais, en vitesse, souvent les mains occupees.
   Gros caracteres, fort contraste, aucune animation. */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --fond:#141212; --carte:#1F1B1C; --trait:rgba(250,250,250,.12);
  --creme:#FAFAFA; --doux:rgba(250,250,250,.56);
  --vert:#3F9D54; --rouge:#ED1F27; --gris:#6E6A6B;
}
body{background:var(--fond);color:var(--creme);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  padding:0 0 40px;-webkit-text-size-adjust:100%}

header{position:sticky;top:0;z-index:5;background:var(--fond);
  border-bottom:1px solid var(--trait);
  padding:14px 16px calc(12px + env(safe-area-inset-top,0px))}
.titre{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:17px;font-weight:700;letter-spacing:.02em}
.jour{font-size:12px;color:var(--doux);margin-top:2px}

/* L'ALERTE LA PLUS IMPORTANTE DE L'ECRAN.
   Sans elle, une imprimante en panne ressemble a un midi calme : les
   commandes arrivent, rien ne sort, et personne ne s'en apercoit avant
   qu'un client se presente avec un numero introuvable en cuisine. */
.alerte{display:none;margin-top:12px;padding:13px 15px;border-radius:9px;
  background:var(--rouge);color:#fff;font-size:14px;font-weight:700;line-height:1.4}
.alerte.on{display:block}
.pause-avis{display:none;margin-top:9px;padding:11px 15px;border-radius:9px;
  background:#4A3A12;color:#FFD98A;font-size:13px;line-height:1.4}
.pause-avis.on{display:block}

.boutons{display:flex;gap:8px;margin-top:12px}
.boutons button{flex:1;min-height:42px;border-radius:9px;cursor:pointer;
  border:1px solid var(--trait);background:rgba(250,250,250,.06);color:var(--creme);
  font-size:13px;font-weight:600;font-family:inherit}
.boutons button:active{background:rgba(250,250,250,.14)}

main{max-width:720px;margin:0 auto;padding:14px 16px}

.cmd{background:var(--carte);border:1px solid var(--trait);border-radius:11px;
  padding:13px 15px;margin-bottom:11px}
/* Un liseré rouge sur le flanc : un ticket non imprime se repere en
   balayant l'ecran des yeux, sans lire les badges un par un. */
.cmd[data-etat="echec"]{border-left:5px solid var(--rouge)}
.cmd-tete{display:flex;align-items:center;justify-content:space-between;gap:10px}
.no{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
/* Le prenom aussi gros que le numero : le comptoir appelle l'un OU l'autre,
   et cherche aussi bien « la commande de Marie » que « la 482 ». */
.nom{font-size:19px;font-weight:600;line-height:1.2;margin-top:3px;color:#F4A0A4}
.heure{font-size:12px;color:var(--doux);margin-top:3px}

.badge{flex:none;padding:6px 11px;border-radius:999px;font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.badge[data-etat="imprimee"]{background:rgba(63,157,84,.18);color:var(--vert)}
.badge[data-etat="en_attente"],.badge[data-etat="envoyee"]{background:rgba(250,250,250,.1);color:var(--gris)}
.badge[data-etat="echec"]{background:var(--rouge);color:#fff}

.articles{margin-top:11px;border-top:1px solid var(--trait);padding-top:10px}
.art{display:flex;gap:10px;padding:4px 0;font-size:15px;line-height:1.35}
.art b{flex:none;min-width:30px;font-variant-numeric:tabular-nums}
.art span small{display:block;font-size:11.5px;color:var(--doux);font-weight:400}

.pied{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px}
.erreur{font-size:11.5px;color:#F4A0A4;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.reimp{min-height:40px;padding:0 16px;border-radius:9px;cursor:pointer;
  border:1px solid rgba(237,31,39,.5);background:rgba(237,31,39,.14);color:#F4A0A4;
  font-size:13px;font-weight:600;font-family:inherit}
.reimp:active{background:rgba(237,31,39,.3)}

.vide{text-align:center;color:var(--doux);font-size:14px;padding:50px 20px;line-height:1.6}
</style>
</head>
<body>

<header>
  <div class="titre">
    <div>
      <h1>Commandes</h1>
      <div class="jour" id="jour">…</div>
    </div>
    <div class="badge" data-etat="en_attente" id="lien">CONNEXION…</div>
  </div>

  <div class="alerte" id="alerte">
    ⚠ IMPRIMANTE HORS LIGNE — les commandes arrivent, rien ne s’imprime.
  </div>
  <div class="pause-avis" id="pauseAvis">
    Commandes en ligne suspendues. Les clients sont invités à passer au comptoir.
  </div>

  <div class="boutons">
    <button type="button" id="btnPause">Suspendre les commandes</button>
  </div>
</header>

<main id="liste"><div class="vide">Chargement…</div></main>

<script>
/* ============================================================
   L'ecran du comptoir.

   Il interroge le serveur toutes les 3 secondes. Pas de websocket : a ce
   rythme, sur un seul commerce, une simple requete fait le travail et se
   remet toute seule d'une coupure de wifi — ce qu'un socket ne fait pas
   sans code supplementaire.
   ============================================================ */

const $ = id => document.getElementById(id);

/* L'adresse porte le secret : c'est elle qui donne acces a cet ecran.
   On la deduit de la page courante plutot que de la coder en dur. */
const BASE = location.pathname.replace(/\/$/, '');

const ETIQUETTE = {
  en_attente: 'EN COURS',
  envoyee:    'EN COURS',
  imprimee:   'IMPRIMÉ',
  echec:      'NON IMPRIMÉ'
};

let enPause = false;

/** Echappement HTML : les noms de plats vont dans du innerHTML. */
function ech(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function rafraichir(){
  let donnees;
  try {
    const r = await fetch(BASE + '/commandes');
    if (!r.ok) throw new Error(r.status);
    donnees = await r.json();
  } catch {
    /* On le DIT plutot que de laisser un ecran fige passer pour a jour. */
    $('lien').dataset.etat = 'echec';
    $('lien').textContent = 'HORS LIGNE';
    return;
  }

  $('lien').dataset.etat = 'imprimee';
  $('lien').textContent = 'À JOUR';
  $('jour').textContent = donnees.journee;

  $('alerte').classList.toggle('on', !donnees.imprimanteEnLigne);
  $('pauseAvis').classList.toggle('on', donnees.enPause);

  enPause = donnees.enPause;
  $('btnPause').textContent = enPause ? 'Reprendre les commandes' : 'Suspendre les commandes';

  peindre(donnees.commandes);
}

function peindre(commandes){
  if (commandes.length === 0){
    $('liste').innerHTML = '<div class="vide">Aucune commande aujourd’hui.</div>';
    return;
  }

  $('liste').innerHTML = commandes.map(c => `
    <article class="cmd" data-etat="${c.etatImpression}">
      <div class="cmd-tete">
        <div>
          <div class="no">#${c.numero}</div>
          <div class="nom">${ech(c.nom)}</div>
          <div class="heure">${ech(c.heure)} · ${c.total} article${c.total > 1 ? 's' : ''}</div>
        </div>
        <div class="badge" data-etat="${c.etatImpression}">${ETIQUETTE[c.etatImpression]}</div>
      </div>

      <div class="articles">
        ${c.articles.map(a => `
          <div class="art"><b>${a.quantite}×</b><span>${ech(a.nom)}<small>${ech(a.section)}</small></span></div>
        `).join('')}
      </div>

      ${c.etatImpression === 'echec' ? `
        <div class="pied">
          <span class="erreur">${ech(c.codeErreur || 'erreur inconnue')}</span>
          <button class="reimp" type="button" data-id="${c.id}">Réimprimer</button>
        </div>` : ''}
    </article>
  `).join('');
}

/* Un seul ecouteur : la liste est reconstruite a chaque rafraichissement. */
$('liste').addEventListener('click', async e => {
  const bouton = e.target.closest('.reimp');
  if (!bouton) return;

  bouton.disabled = true;
  bouton.textContent = 'Envoi…';
  await fetch(BASE + '/commandes/' + bouton.dataset.id + '/reimprimer', { method:'POST' })
    .catch(() => {});
  rafraichir();
});

$('btnPause').addEventListener('click', async () => {
  /* Confirmation seulement pour suspendre : reprendre n'a aucun risque. */
  if (!enPause && !confirm('Suspendre les commandes en ligne ?')) return;
  await fetch(BASE + '/pause', { method:'POST' }).catch(() => {});
  rafraichir();
});

rafraichir();
setInterval(rafraichir, 3000);
</script>
</body>
</html>
